name: nutriequine_app
description: "NutriEquine - Horse Care Operating System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3

  # State management
  provider: ^6.1.2

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  table_calendar: ^3.1.2
  image_picker: ^1.1.2
  flutter_local_notifications: ^17.2.3

  # New — analytics charts
  fl_chart: ^0.68.0

  # New — QR code scanner
  mobile_scanner: ^5.1.0

  # New — local storage for premium flag
  shared_preferences: ^2.3.2

  # New — offline/connectivity detection
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
