name: nutriequine_app
description: "NutriEquine - Horse Care Operating System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_storage: ^13.4.6
  firebase_messaging: ^16.5.0

  # State management
  provider: ^6.1.2

  # Utilities
  intl: ^0.20.3
  uuid: ^4.5.1
  table_calendar: ^3.1.2
  image_picker: ^1.1.2
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1

  # New — analytics charts
  fl_chart: ^1.2.0

  # New — QR code scanner
  mobile_scanner: ^7.4.0

  # New — local storage for premium flag
  shared_preferences: ^2.3.2

  # New — offline/connectivity detection
  connectivity_plus: ^7.3.1

  # New — social sign-in
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/google_logo.png